substitutions:
  device_name: garage-epaper
  friendly_name: Garage ePaper
  hide_main_header_on_single_list: "true"

  list_1_title: "Errands"
  list_1_entity: "sensor.todo_errands_formatted"

  list_2_title: "Returns"
  list_2_entity: "sensor.todo_returns_formatted"

  ha_page_select_entity: "input_select.upstairs_epaper_page"

  weather_state_entity: "weather.openweathermap"
  weather_temp_entity: "sensor.wn1980b_outdoor_temperature"
  weather_high_entity: "sensor.owm_daily_high_temperature"
  weather_low_entity: "sensor.owm_daily_low_temperature"
  weather_precip_entity: "sensor.today_precip_chance"

external_components:
  - source: github://samperk1/esphome-crowpanel-579
    components: [crowpanel_579]

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  framework:
    type: esp-idf

logger:

psram:
  mode: octal
  speed: 80MHZ

api:
  encryption:
    key: "Mkdg0z37J7S4uW0B37bWhajBkXk9RIX8r1UwRf2qi6c="
  on_client_connected:
    - logger.log: "*** Connected to HA. Synchronizing page & states... ***"
    - delay: 3s
    - lvgl.label.update:
        id: todo_list_1_label
        text: !lambda "return id(todo_list_1_text);"
    - lvgl.label.update:
        id: todo_list_2_label
        text: !lambda "return id(todo_list_2_text);"
    - component.update: mini_paper_display
    - script.execute: reset_sleep_timer

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${friendly_name} Fallback Hotspot"
    password: "p1vsNeal0kFP"

captive_portal:

globals:
  - id: current_page
    type: int
    initial_value: "0"
  - id: rotation_val
    type: int
    initial_value: "0"
  - id: font_size_val
    type: int
    initial_value: "1"
  - id: todo_list_1_text
    type: std::string
    initial_value: '""'
  - id: todo_list_2_text
    type: std::string
    initial_value: '""'

script:
  - id: reset_sleep_timer
    mode: restart
    then:
      - delay: 30s
      - if:
          condition:
            binary_sensor.is_on: maintenance_mode
          then:
            - logger.log: "*** Maintenance mode is ON. Staying awake. ***"
          else:
            - logger.log: "*** 30s idle timeout reached. Sleeping. ***"
            - deep_sleep.enter: deep_sleep_mode

deep_sleep:
  id: deep_sleep_mode
  sleep_duration: 15min
  esp32_ext1_wakeup:
    pins:
      - number: 1
        allow_other_uses: true
      - number: 2
        allow_other_uses: true
      - number: 4
        allow_other_uses: true
      - number: 5
        allow_other_uses: true
      - number: 6
        allow_other_uses: true
    mode: ANY_LOW

spi:
  clk_pin: 12
  mosi_pin: 11

display:
  - platform: crowpanel_579
    id: mini_paper_display
    cs_pin: GPIO45
    dc_pin: GPIO46
    reset_pin: GPIO47
    busy_pin:
      number: GPIO48
      mode:
        input: true
        pulldown: true
    power_pin: GPIO7
    auto_clear_enabled: false

lvgl:
  displays:
    - mini_paper_display
  color_depth: 16
  bg_color: 0xFFFFFF
  on_draw_end:
    - lambda: "id(mini_paper_display).display();"
  rotation: 90

  pages:
    - id: main_page
      widgets:
        - obj:
            id: root_container
            width: 100%
            height: 100%
            pad_all: 0
            border_width: 0
            bg_opa: TRANSP
            widgets:
              - obj:
                  id: notification_bar
                  x: 0
                  y: 740
                  width: 100%
                  height: 48
                  pad_left: 4
                  pad_right: 4
                  pad_top: 1
                  pad_bottom: 1
                  border_width: 1
                  border_color: 0xFFFFFF
                  bg_color: 0x000000
                  bg_opa: COVER
                  widgets:
                    - obj:
                        id: notification_icons_row
                        x: 0
                        y: 0
                        width: 100%
                        height: 30
                        pad_all: 0
                        border_width: 0
                        bg_opa: TRANSP
                        layout:
                          type: flex
                          flex_flow: row
                          flex_align_main: space_evenly
                          flex_align_cross: center
                        widgets:
                          - label: { text: "\U000F0590", text_color: 0xFFFFFF, text_font: font_mdi_icons }
                          - label: { text: "\U000F019A", text_color: 0xFFFFFF, text_font: font_mdi_icons }
                          - label: { text: "\U000F01B8", text_color: 0xFFFFFF, text_font: font_mdi_icons }
                          - label: { text: "\U000F06B6", text_color: 0xFFFFFF, text_font: font_mdi_icons }
                          - label: { text: "\U000F0995", text_color: 0xFFFFFF, text_font: font_mdi_icons }

                    - label:
                        id: updated_label
                        x: 4
                        y: 24
                        text: "Updated"
                        text_color: 0xFFFFFF
                        text_font: font_small

                    - label:
                        id: updated_time_label
                        x: 230
                        y: 24
                        text_color: 0xFFFFFF
                        text_font: font_small
                        text: !lambda |-
                          auto now = id(my_sntp).now();
                          if (!now.is_valid()) return std::string("--:--");
                          return now.strftime("%H:%M");

              - obj:
                  id: garage_column
                  x: 4
                  y: 4
                  width: 264
                  height: 366
                  pad_all: 0
                  border_width: 1
                  border_color: 0x000000
                  bg_color: 0xFFFFFF
                  bg_opa: COVER
                  widgets:
                    - obj:
                        x: 0
                        y: 0
                        width: 100%
                        height: 40
                        pad_all: 0
                        border_width: 0
                        bg_color: 0x000000
                        bg_opa: COVER
                        widgets:
                          - label:
                              text: "${list_2_title}"
                              text_color: 0xFFFFFF
                              text_font: font_title_medium
                              align: CENTER

                    - label:
                        id: todo_list_2_label
                        x: 8
                        y: 44
                        width: 248
                        height: 332
                        text_color: 0x000000
                        text_font: font_large
                        long_mode: WRAP
                        align: TOP_LEFT
                        text: "..."

              - obj:
                  id: returns_column
                  x: 4
                  y: 374
                  width: 264
                  height: 366
                  pad_all: 0
                  border_width: 1
                  border_color: 0x000000
                  bg_color: 0xFFFFFF
                  bg_opa: COVER
                  widgets:
                    - obj:
                        x: 0
                        y: 0
                        width: 100%
                        height: 40
                        pad_all: 0
                        border_width: 0
                        bg_color: 0x000000
                        bg_opa: COVER
                        widgets:
                          - label:
                              text: "${list_1_title}"
                              text_color: 0xFFFFFF
                              text_font: font_title_medium
                              align: CENTER

                    - label:
                        id: todo_list_1_label
                        x: 8
                        y: 44
                        width: 248
                        height: 332
                        text_color: 0x000000
                        text_font: font_large
                        long_mode: WRAP
                        align: TOP_LEFT
                        text: "..."

time:
  - platform: sntp
    id: my_sntp
    timezone: America/New_York
    on_time:
      - seconds: /30
        then:
          - component.update: mini_paper_display

font:
  - file: "gfonts://Roboto"
    id: my_font
    size: 24
    bpp: 1

  - file: "gfonts://Roboto"
    id: font_small
    size: 12
    glyphs: ' !"#$%&''()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\]^_`abcdefghijklmnopqrstuvwxyz{|}~°•'

  - file: "gfonts://Roboto"
    id: font_medium
    size: 16
    glyphs: ' !"#$%&''()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\]^_`abcdefghijklmnopqrstuvwxyz{|}~°•'

  - file: "gfonts://Merriweather"
    id: font_large
    size: 32
    glyphs: ' !"#$%&''()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\]^_`abcdefghijklmnopqrstuvwxyz{|}~°•'

  - file: "gfonts://Roboto"
    id: font_title_small
    size: 24
    glyphs: ' !"#$%&''()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\]^_`abcdefghijklmnopqrstuvwxyz{|}~'

  - file: "gfonts://Merriweather"
    id: font_title_medium
    size: 36
    glyphs: ' !"#$%&''()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\]^_`abcdefghijklmnopqrstuvwxyz{|}~'

  - file: "gfonts://Merriweather"
    id: font_title_large
    size: 50
    glyphs: ' !"#$%&''()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\]^_`abcdefghijklmnopqrstuvwxyz{|}~'

  - file: "gfonts://Material Symbols Outlined"
    id: font_weather_icon
    size: 44
    glyphs:
      - "\ue81a"
      - "\uf15c"
      - "\ue2bd"
      - "\uf04e"
      - "\uf053"
      - "\uf01e"
      - "\ue818"

  - file: "fonts/materialdesignicons-webfont.ttf"
    id: font_mdi_icons
    size: 22
    bpp: 1
    glyphs:
      - "\U000F0590"
      - "\U000F019A"
      - "\U000F01B8"
      - "\U000F06B6"
      - "\U000F0995"

text_sensor:
  - platform: homeassistant
    id: ha_page_select
    entity_id: ${ha_page_select_entity}
    on_value:
      then:
        - lambda: |-
            if (x == "Default") id(current_page) = 0;
            else if (x == "Weather") id(current_page) = 1;
            else if (x == "List 1 Only") id(current_page) = 2;
            else if (x == "List 2 Only") id(current_page) = 3;

  - platform: homeassistant
    id: todo_list_1_src
    entity_id: ${list_1_entity}
    on_value:
      then:
        - logger.log:
            format: "todo_list_1_src state: [%s]"
            args: [ 'id(todo_list_1_src).state.c_str()' ]
        - lambda: |-
            id(todo_list_1_text) = x.empty() ? std::string("Nothing to do") : x;
        - lvgl.label.update:
            id: todo_list_1_label
            text: !lambda "return id(todo_list_1_text);"
        - delay: 200ms
        - component.update: mini_paper_display

  - platform: homeassistant
    id: todo_list_2_src
    entity_id: ${list_2_entity}
    on_value:
      then:
        - logger.log:
            format: "todo_list_2_src state: [%s]"
            args: [ 'id(todo_list_2_src).state.c_str()' ]
        - lambda: |-
            id(todo_list_2_text) = x.empty() ? std::string("Nothing to do") : x;
        - lvgl.label.update:
            id: todo_list_2_label
            text: !lambda "return id(todo_list_2_text);"
        - delay: 200ms
        - component.update: mini_paper_display

select:
  - platform: template
    name: "Rotation"
    id: display_rotation
    optimistic: true
    initial_option: "90°"
    options: ["0°", "90°", "180°", "270°"]
    on_value:
      - lambda: |-
          if (x == "0°") id(rotation_val) = 0;
          else if (x == "90°") id(rotation_val) = 90;
          else if (x == "180°") id(rotation_val) = 180;
          else if (x == "270°") id(rotation_val) = 270;
      - component.update: mini_paper_display

  - platform: template
    name: "Font Size"
    id: font_size
    optimistic: true
    initial_option: "Medium"
    options: ["Small", "Medium", "Large"]
    on_value:
      - lambda: |-
          if (x == "Small") id(font_size_val) = 0;
          else if (x == "Medium") id(font_size_val) = 1;
          else if (x == "Large") id(font_size_val) = 2;
      - component.update: mini_paper_display

switch:
  - platform: template
    name: "Invert Display"
    id: invert_display
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - component.update: mini_paper_display
    on_turn_off:
      - component.update: mini_paper_display

text:
  - platform: template
    name: "Important Message"
    id: important_message
    mode: TEXT
    optimistic: true
    initial_value: ""
    on_value:
      - component.update: mini_paper_display

binary_sensor:
  - platform: homeassistant
    id: maintenance_mode
    entity_id: input_boolean.epaper_maintenance_mode
    name: "Maintenance Mode"
    on_release:
      then:
        - logger.log: "*** Maintenance mode toggled OFF. Resetting sleep timer. ***"
        - script.execute: reset_sleep_timer

  - platform: gpio
    pin:
      number: 1
      inverted: true
      mode: INPUT_PULLUP
      allow_other_uses: true
    name: "Exit Button"
    on_press: &button_action
      - script.execute: reset_sleep_timer
      - if:
          condition:
            lambda: 'return id(important_message).state != "";'
          then:
            - text.set:
                id: important_message
                value: ""
            - component.update: mini_paper_display

  - platform: gpio
    pin:
      number: 2
      inverted: true
      mode: INPUT_PULLUP
      allow_other_uses: true
    name: "Menu Button"
    on_press: *button_action

  - platform: gpio
    pin:
      number: 5
      inverted: true
      mode: INPUT_PULLUP
      allow_other_uses: true
    name: "Dial Confirm"
    on_press: *button_action

  - platform: gpio
    pin:
      number: 4
      inverted: true
      mode: INPUT_PULLUP
      allow_other_uses: true
    name: "Dial Down"
    on_press:
      - script.execute: reset_sleep_timer
      - lambda: |-
          int max_pages = (std::string("${list_2_entity}") != "" && std::string("${list_2_entity}") != "none") ? 3 : 2;
          id(current_page) += 1;
          if (id(current_page) > max_pages) id(current_page) = 0;
      - component.update: mini_paper_display

  - platform: gpio
    pin:
      number: 6
      inverted: true
      mode: INPUT_PULLUP
      allow_other_uses: true
    name: "Dial Up"
    on_press:
      - script.execute: reset_sleep_timer
      - lambda: |-
          int max_pages = (std::string("${list_2_entity}") != "" && std::string("${list_2_entity}") != "none") ? 3 : 2;
          id(current_page) -= 1;
          if (id(current_page) < 0) id(current_page) = max_pages;
      - component.update: mini_paper_display